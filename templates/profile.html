{% extends "base.html" %}

{% block title %}Your Profile - CareerGuide AI{% endblock %}

{% block content %}
<div class="login-page">
    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <i data-feather="user"></i>
                    <h2>Your Profile</h2>
                    <p>This helps us suggest the right careers for you</p>
                </div>

                <form method="POST" class="login-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="form-group">
                        <label for="stage">Which class are you in?</label>
                        <select id="stage" name="stage" class="career-select" required>
                            <option value="">Select your stage...</option>
                            <option value="class10" {% if profile and profile.stage == 'class10' %}selected{% endif %}>Class 10</option>
                            <option value="class12" {% if profile and profile.stage == 'class12' %}selected{% endif %}>Class 12</option>
                            <option value="college" {% if profile and profile.stage == 'college' %}selected{% endif %}>College</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="stream">Your stream</label>
                        <input type="text" id="stream" name="stream" placeholder="e.g. Science, Commerce, Humanities"
                               value="{{ profile.stream if profile and profile.stream else '' }}">
                    </div>

                    <div class="form-group">
                        <label for="interests_text">What interests you?</label>
                        <textarea id="interests_text" name="interests_text" rows="4"
                                  placeholder="Tell us about your interests and goals">{{ profile.interests_text if profile and profile.interests_text else '' }}</textarea>
                    </div>

                    <div class="form-group">
                        <label for="city">Your city</label>
                        <input type="text" id="city" name="city" placeholder="e.g. Bengaluru"
                               value="{{ profile.city if profile and profile.city else '' }}">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
