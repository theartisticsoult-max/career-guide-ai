{% extends "base.html" %}

{% block title %}Your Profile - CareerGuide AI{% endblock %}

{% block content %}
<div class="login-page profile-page">
    <div class="container">
        <div class="login-container profile-container">
            <div class="login-card profile-card">
                <div class="login-header profile-header">
                    <i data-feather="user"></i>
                    <div>
                        <h2>Your Profile</h2>
                        <p>This helps us suggest the right careers for you</p>
                    </div>
                </div>

                <form method="POST" class="login-form profile-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="form-group">
                        <label for="stage">Which class are you in?</label>
                        <select id="stage" name="stage" class="career-select" required>
                            <option value="">Select your stage...</option>
                            <option value="class10" {% if profile and profile.stage == 'class10' %}selected{% endif %}>Class 10</option>
                            <option value="class12" {% if profile and profile.stage == 'class12' %}selected{% endif %}>Class 12</option>
                            <option value="college" {% if profile and profile.stage == 'college' %}selected{% endif %}>College</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="stream">Your stream</label>
                        <input type="text" id="stream" name="stream" placeholder="e.g. Science, Commerce, Humanities"
                               value="{{ profile.stream if profile and profile.stream else '' }}">
                    </div>

                    <div class="form-group">
                        <label for="interests_text">What interests you?</label>
                        <textarea id="interests_text" name="interests_text" rows="4"
                                  placeholder="Tell us about your interests and goals">{{ profile.interests_text if profile and profile.interests_text else '' }}</textarea>
                    </div>

                    <div class="form-group">
                        <label for="city">Your city</label>
                        <input type="text" id="city" name="city" placeholder="e.g. Bengaluru"
                               value="{{ profile.city if profile and profile.city else '' }}">
                    </div>

                    <div class="form-group">
                        <label for="country">Country or region</label>
                        <input type="text" id="country" name="country" placeholder="e.g. India"
                               value="{{ profile.country if profile and profile.country else '' }}">
                    </div>

                    <div class="form-group">
                        <label for="region">State / province (optional)</label>
                        <input type="text" id="region" name="region" placeholder="e.g. Karnataka"
                               value="{{ profile.region if profile and profile.region else '' }}">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.profile-page {
    padding: 48px 0 80px;
    background: var(--bg, #F9F7F5);
}

.profile-container {
    max-width: 1080px;
}

.profile-card {
    padding: 40px 48px;
    box-shadow: var(--shadow, 0 4px 12px rgba(0,0,0,0.05));
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    margin-bottom: 32px;
}

.profile-header i {
    width: 48px;
    height: 48px;
    color: var(--primary, #4A6FA5);
    flex-shrink: 0;
}

.profile-header h2 {
    font-size: 1.75rem;
    margin-bottom: 4px;
}

.profile-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px 32px;
}

.profile-form .form-group {
    margin-bottom: 0;
    min-width: 0;
}

.profile-form .form-group:nth-of-type(3) {
    grid-column: 1 / -1;
}

.profile-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text, #2D3E50);
}

.profile-form input,
.profile-form select,
.profile-form textarea {
    width: 100%;
    min-width: 0;
    padding: 12px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text, #2D3E50);
    background: var(--surface, #FFFFFF);
    transition: border-color 0.3s, box-shadow 0.3s;
}

.profile-form textarea {
    min-height: 110px;
    resize: vertical;
}

.profile-form input:focus,
.profile-form select:focus,
.profile-form textarea:focus {
    outline: none;
    border-color: var(--primary, #4A6FA5);
    box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
}

.profile-form .btn-block {
    grid-column: 1 / -1;
    width: auto;
    max-width: 240px;
}

@media (max-width: 768px) {
    .profile-page {
        padding: 32px 0 60px;
    }

    .profile-card {
        padding: 24px;
    }

    .profile-form {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .profile-form .form-group:nth-of-type(3) {
        grid-column: auto;
    }

    .profile-form .btn-block {
        width: 100%;
        max-width: none;
    }
}
</style>
{% endblock %}
